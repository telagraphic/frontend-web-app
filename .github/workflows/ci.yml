name: CI

on:
  push:
  pull_request:

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - name: Upload browser results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-starter
          path: test-results
          if-no-files-found: ignore

  created:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gsap-page-swap-nunjucks
            transition: gsap
            navigation: page-swap
            renderer: nunjucks
            playwright: true
          - name: gsap-document-load-nunjucks
            transition: gsap
            navigation: document-load
            renderer: nunjucks
            playwright: true
          - name: view-page-swap-nunjucks
            transition: view
            navigation: page-swap
            renderer: nunjucks
            playwright: true
          - name: view-document-load-nunjucks
            transition: view
            navigation: document-load
            renderer: nunjucks
            playwright: true
          - name: none-document-load-nunjucks
            transition: none
            navigation: document-load
            renderer: nunjucks
            playwright: true
          - name: gsap-page-swap-vento
            transition: gsap
            navigation: page-swap
            renderer: vento
            playwright: false
          - name: gsap-page-swap-jsx
            transition: gsap
            navigation: page-swap
            renderer: jsx
            playwright: false
    name: created ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Create site
        run: >
          bun run create "$RUNNER_TEMP/site"
          --transition ${{ matrix.transition }}
          --navigation ${{ matrix.navigation }}
          --renderer ${{ matrix.renderer }}
          --name Site
          --origin https://example.com
      - name: Install, lint, test, build
        working-directory: ${{ runner.temp }}/site
        run: |
          bun install
          bun run lint
          bun run format:check
          bun test
          bun run build
      - name: Playwright
        if: ${{ matrix.playwright }}
        working-directory: ${{ runner.temp }}/site
        run: |
          bunx playwright install --with-deps chromium
          bun run test:browser
      - name: Upload browser results
        if: failure() && matrix.playwright
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.name }}
          path: ${{ runner.temp }}/site/test-results
          if-no-files-found: ignore

  packed:
    runs-on: ubuntu-latest
    name: packed gsap-page-swap-nunjucks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Pack and create from the bin
        run: |
          bun pm pack --quiet
          tarball=(frontend-web-app-*.tgz)
          mkdir -p "$RUNNER_TEMP/prefix"
          cd "$RUNNER_TEMP/prefix"
          bun add "$GITHUB_WORKSPACE/${tarball[0]}"
          "$RUNNER_TEMP/prefix/node_modules/.bin/frontend-web-app" \
            "$RUNNER_TEMP/packed" \
            --transition gsap \
            --navigation page-swap \
            --renderer nunjucks \
            --name Site \
            --origin https://example.com
          cd "$GITHUB_WORKSPACE"
          bun run create "$RUNNER_TEMP/checkout" \
            --transition gsap \
            --navigation page-swap \
            --renderer nunjucks \
            --name Site \
            --origin https://example.com
          diff -rq "$RUNNER_TEMP/packed" "$RUNNER_TEMP/checkout" > "$RUNNER_TEMP/pack-diff" || true
          # bun pm pack omits bun.lock even though package.json files lists it.
          if grep -v "^Only in $RUNNER_TEMP/checkout: bun.lock$" "$RUNNER_TEMP/pack-diff" | grep -q .; then
            cat "$RUNNER_TEMP/pack-diff"
            exit 1
          fi
          test ! -d "$RUNNER_TEMP/packed/wizard"
      - name: Install, lint, test, build
        working-directory: ${{ runner.temp }}/packed
        run: |
          bun install
          bun run lint
          bun run format:check
          bun test
          bun run build
